name: Build and commit standalone bundle for cPanel

# This workflow builds the Next.js project on every push to `main` and
# commits the resulting `.next/standalone` directory back to the branch.
# cPanel can then pull the repo and already have the prebuilt bundle,
# avoiding memory errors on host machines that cannot run `next build`.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build application
        run: npm run build

      - name: Commit built bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .next/standalone
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built bundle [skip ci]"
            git push
          fi
